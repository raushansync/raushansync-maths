<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6" id="theme-color-meta">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Set New Password - RaushanSYNC Maths</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        :root {
            --header-height: 70px;
        }

        main {
            padding-top: calc(var(--header-height) + 40px);
            padding-bottom: 4rem;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--header-height) - 60px);
            padding: 2rem 0;
        }

        .auth-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .auth-header p {
            color: var(--secondary-text-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: var(--text-color);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: var(--card-background);
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: var(--secondary-text-color);
        }

        input:disabled {
            background-color: rgba(0, 0, 0, 0.04);
            cursor: not-allowed;
        }

        .dark-mode input:disabled {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-wrapper input {
            padding-right: 40px;
        }

        .password-toggle-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-text-color);
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: color 0.2s;
        }

        .password-toggle-btn:hover {
            color: var(--primary-color);
            transform: none;
            background: none;
        }

        .password-hint {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            margin-top: 0.3rem;
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.2s, transform 0.15s;
            margin-bottom: 1rem;
        }

        /* Exclude header buttons from generic button styling */
        .theme-toggle-btn,
        .hamburger,
        .navbar-hamburger {
            width: 44px !important;
            padding: 0 !important;
            background: none !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            font-size: 0 !important;
            font-weight: normal !important;
            margin-bottom: 0 !important;
            color: var(--text-color) !important;
        }

        .theme-toggle-btn {
            color: var(--primary-color) !important;
            margin-right: 0.5rem;
        }

        .navbar-hamburger {
            margin-left: 0.75rem;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-color-dark, var(--primary-color));
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .dark-mode .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .dark-mode .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .success.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .loading.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            main {
                padding-top: calc(var(--header-height) + 20px);
            }

            .auth-card {
                padding: 2rem;
                border-radius: 12px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            main {
                padding-right: var(--container-padding);
                padding-left: var(--container-padding);
            }

            .auth-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="/" class="logo">RaushanSYNC Maths</a>
            <div id="nav"></div>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                    </svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                </button>
</div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Set New Password</h1>
                        <p>Enter a new password for your account</p>
                    </div>

                    <div class="error" id="errorMessage" role="alert" aria-live="polite"></div>
                    <div class="success" id="successMessage" role="status" aria-live="polite"></div>
                    <div class="loading" id="loading">Updating password...</div>

                    <form id="resetConfirmForm" style="display: none;">
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                                <button type="button" class="password-toggle-btn" id="newPasswordToggle" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                    <svg class="eye-off-icon" style="display: none; width: 20px; height: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                    </svg>
                                </button>
                            </div>
                            <div class="password-hint">Password must be at least 8 characters long</div>
                        </div>

                        <div class="form-group">
                            <label for="confirmNewPassword">Confirm Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Confirm new password" required>
                                <button type="button" class="password-toggle-btn" id="confirmNewPasswordToggle" aria-label="Toggle password visibility">
                                    <svg class="eye-icon-confirm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                    <svg class="eye-off-icon-confirm" style="display: none; width: 20px; height: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="confirmBtn">Update Password</button>

                        <div class="back-link">
                            <a href="/login">Back to Sign In</a>
                        </div>
                    </form>

                    <div id="sessionExpired" style="display: none; text-align: center;">
                        <p style="color: var(--secondary-text-color); margin-bottom: 1.5rem;">Your password reset link has expired. Please request a new one.</p>
                        <div class="back-link">
                            <a href="/password-reset">Request New Link</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Load dependencies first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <script src="/assets/js/auth-config.js"></script>
    
    <!-- Main app script -->
    <script src="/assets/js/script.js"></script>
    
    <!-- Auth guard for protected pages -->
    <script src="/assets/js/auth-guard.js"></script>

    <script>
        // Check if user has a valid session from email link
        async function checkSession() {
            if (!window.supabaseClient) {
                document.getElementById("errorMessage").textContent = "Authentication service unavailable.";
                document.getElementById("errorMessage").classList.add("show");
                return;
            }

            const { data: { session }, error } = await window.supabaseClient.auth.getSession();

            if (!session || !session.user) {
                document.getElementById("sessionExpired").style.display = "block";
                return;
            }

            document.getElementById("resetConfirmForm").style.display = "block";
            setupPasswordToggles();
        }

        // Password visibility toggles
        function setupPasswordToggles() {
            const newPasswordInput = document.getElementById("newPassword");
            const newPasswordToggle = document.getElementById("newPasswordToggle");
            const eyeIcon = document.querySelector(".eye-icon");
            const eyeOffIcon = document.querySelector(".eye-off-icon");

            newPasswordToggle.addEventListener("click", (e) => {
                e.preventDefault();
                const isPasswordVisible = newPasswordInput.type === "text";
                newPasswordInput.type = isPasswordVisible ? "password" : "text";
                eyeIcon.style.display = isPasswordVisible ? "block" : "none";
                eyeOffIcon.style.display = isPasswordVisible ? "none" : "block";
            });

            const confirmNewPasswordInput = document.getElementById("confirmNewPassword");
            const confirmNewPasswordToggle = document.getElementById("confirmNewPasswordToggle");
            const eyeIconConfirm = document.querySelector(".eye-icon-confirm");
            const eyeOffIconConfirm = document.querySelector(".eye-off-icon-confirm");

            confirmNewPasswordToggle.addEventListener("click", (e) => {
                e.preventDefault();
                const isPasswordVisible = confirmNewPasswordInput.type === "text";
                confirmNewPasswordInput.type = isPasswordVisible ? "password" : "text";
                eyeIconConfirm.style.display = isPasswordVisible ? "block" : "none";
                eyeOffIconConfirm.style.display = isPasswordVisible ? "none" : "block";
            });
        }

        async function handlePasswordUpdate(e) {
            e.preventDefault();
            const newPassword = document.getElementById("newPassword").value;
            const confirmNewPassword = document.getElementById("confirmNewPassword").value;
            const errorDiv = document.getElementById("errorMessage");
            const successDiv = document.getElementById("successMessage");
            const loadingDiv = document.getElementById("loading");
            const confirmBtn = document.getElementById("confirmBtn");

            if (!newPassword || !confirmNewPassword) {
                errorDiv.textContent = "Please fill in all fields.";
                errorDiv.classList.add("show");
                return;
            }

            if (newPassword.length < 8) {
                errorDiv.textContent = "Password must be at least 8 characters long.";
                errorDiv.classList.add("show");
                return;
            }

            if (newPassword !== confirmNewPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.classList.add("show");
                return;
            }

            confirmBtn.disabled = true;
            loadingDiv.classList.add("show");
            errorDiv.classList.remove("show");
            successDiv.classList.remove("show");

            try {
                const { error } = await window.supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    let errMsg = error.message || "Failed to update password. Please try again.";
                    if (errMsg.includes("contain at least one character of each") || errMsg.includes("abcdefghijklmnopqrstuvwxyz")) {
                        errMsg = "Password must contain at least one letter and one number.";
                    }
                    errorDiv.textContent = errMsg;
                    errorDiv.classList.add("show");
                    confirmBtn.disabled = false;
                    loadingDiv.classList.remove("show");
                    return;
                }

                successDiv.textContent = "Password updated successfully! Redirecting to login...";
                successDiv.classList.add("show");
                loadingDiv.classList.remove("show");

                setTimeout(() => {
                    window.location.replace("/login?message=password-reset-success");
                }, 2000);
            } catch (err) {
                errorDiv.textContent = "An error occurred. Please try again.";
                errorDiv.classList.add("show");
                confirmBtn.disabled = false;
                loadingDiv.classList.remove("show");
            }
        }

        document.getElementById("resetConfirmForm").addEventListener("submit", handlePasswordUpdate);
        window.addEventListener("load", checkSession);
    </script>
</body>
</html>
