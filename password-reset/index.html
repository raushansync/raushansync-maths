<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6" id="theme-color-meta">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Reset Password - RaushanSYNC Maths</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        :root {
            --header-height: 70px;
        }

        main {
            padding-top: calc(var(--header-height) + 40px);
            padding-bottom: 4rem;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--header-height) - 60px);
            padding: 2rem 0;
        }

        .auth-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .auth-header p {
            color: var(--secondary-text-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: var(--text-color);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: var(--card-background);
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: var(--secondary-text-color);
        }

        input:disabled {
            background-color: rgba(0, 0, 0, 0.04);
            cursor: not-allowed;
        }

        .dark-mode input:disabled {
            background-color: rgba(255, 255, 255, 0.04);
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.2s, transform 0.15s;
            margin-bottom: 1rem;
        }

        /* Exclude header buttons from generic button styling */
        .theme-toggle-btn,
        .hamburger,
        .navbar-hamburger {
            width: 44px !important;
            padding: 0 !important;
            background: none !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            font-size: 0 !important;
            font-weight: normal !important;
            margin-bottom: 0 !important;
            color: var(--text-color) !important;
        }

        .theme-toggle-btn {
            color: var(--primary-color) !important;
            margin-right: 0.5rem;
        }

        .navbar-hamburger {
            margin-left: 0.75rem;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-color-dark, var(--primary-color));
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .dark-mode .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .dark-mode .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .success.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .loading.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            main {
                padding-top: calc(var(--header-height) + 20px);
            }

            .auth-card {
                padding: 2rem;
                border-radius: 12px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            main {
                padding-right: var(--container-padding);
                padding-left: var(--container-padding);
            }

            .auth-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="/" class="logo">RaushanSYNC Maths</a>
            <div id="nav"></div>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                    </svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                </button>
</div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Reset Password</h1>
                        <p>Enter your email address and we'll send you a link to reset your password</p>
                    </div>

                    <div class="error" id="errorMessage" role="alert" aria-live="polite"></div>
                    <div class="success" id="successMessage" role="status" aria-live="polite"></div>
                    <div class="loading" id="loading">Sending reset link...</div>

                    <form id="resetForm">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="your@example.com" required>
                        </div>

                        <button type="submit" id="resetBtn">Send Reset Link</button>

                        <div class="back-link">
                            <a href="/login">Back to Sign In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Load dependencies first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <script src="/assets/js/auth-config.js"></script>
    
    <!-- Main app script -->
    <script src="/assets/js/script.js"></script>
    
    <!-- Auth guard for protected pages -->
    <script src="/assets/js/auth-guard.js"></script>

    <script>
        async function handlePasswordReset(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const errorDiv = document.getElementById("errorMessage");
            const successDiv = document.getElementById("successMessage");
            const loadingDiv = document.getElementById("loading");
            const resetBtn = document.getElementById("resetBtn");

            if (!email) {
                errorDiv.textContent = "Please enter your email address.";
                errorDiv.classList.add("show");
                return;
            }

            if (!window.supabaseClient) {
                errorDiv.textContent = "Authentication service unavailable.";
                errorDiv.classList.add("show");
                return;
            }

            resetBtn.disabled = true;
            loadingDiv.classList.add("show");
            errorDiv.classList.remove("show");
            successDiv.classList.remove("show");

            try {
                const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/reset-confirmation`
                });

                if (error) {
                    errorDiv.textContent = error.message || "Failed to send reset link. Please try again.";
                    errorDiv.classList.add("show");
                    resetBtn.disabled = false;
                    loadingDiv.classList.remove("show");
                    return;
                }

                successDiv.textContent = `Password reset link sent to ${email}. Please check your email and follow the link to reset your password.`;
                successDiv.classList.add("show");
                document.getElementById("resetForm").reset();
                resetBtn.disabled = false;
                loadingDiv.classList.remove("show");
            } catch (err) {
                errorDiv.textContent = "An error occurred. Please try again.";
                errorDiv.classList.add("show");
                resetBtn.disabled = false;
                loadingDiv.classList.remove("show");
            }
        }

        document.getElementById("resetForm").addEventListener("submit", handlePasswordReset);
    </script>
</body>
</html>
