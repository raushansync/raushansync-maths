<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6" id="theme-color-meta">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Sign Up - RaushanSYNC Maths</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        :root {
            --header-height: 70px;
        }

        main {
            padding-top: calc(var(--header-height) + 40px);
            padding-bottom: 4rem;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--header-height) - 60px);
            padding: 2rem 0;
        }

        .auth-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .auth-header p {
            color: var(--secondary-text-color);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: var(--text-color);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: var(--card-background);
            color: var(--text-color);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: var(--secondary-text-color);
        }

        input:disabled,
        select:disabled {
            background-color: rgba(0, 0, 0, 0.04);
            cursor: not-allowed;
        }

        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-wrapper input {
            padding-right: 40px;
        }

        .password-toggle-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-text-color);
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: color 0.2s;
        }

        .password-toggle-btn:hover {
            color: var(--primary-color);
            transform: none;
            background: none;
        }

        .dark-mode input:disabled,
        .dark-mode select:disabled {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .password-hint {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            margin-top: 0.3rem;
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.2s, transform 0.15s;
            margin-bottom: 1rem;
        }

        /* Exclude header buttons from generic button styling */
        .theme-toggle-btn,
        .hamburger,
        .navbar-hamburger {
            width: 44px !important;
            padding: 0 !important;
            background: none !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            font-size: 0 !important;
            font-weight: normal !important;
            margin-bottom: 0 !important;
            color: var(--text-color) !important;
        }

        .theme-toggle-btn {
            color: var(--primary-color) !important;
            margin-right: 0.5rem;
        }

        .navbar-hamburger {
            margin-left: 0.75rem;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-color-dark, var(--primary-color));
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .dark-mode .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .dark-mode .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .success.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .loading.show {
            display: block;
        }

        .divider {
            text-align: center;
            color: var(--secondary-text-color);
            font-size: 0.85rem;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            position: relative;
            background: var(--card-background);
            padding: 0 0.75rem;
        }

        .login-link {
            text-align: center;
            color: var(--secondary-text-color);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: var(--primary-color-dark, var(--primary-color));
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            main {
                padding-top: calc(var(--header-height) + 20px);
            }

            .auth-card {
                padding: 2rem;
                border-radius: 12px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            main {
                padding-right: var(--container-padding);
                padding-left: var(--container-padding);
            }

            .auth-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
</head>

        <div class="container header-container">
            <a href="/" class="logo">RaushanSYNC Maths</a>
            <div id="nav"></div>
            <div class="header-actions">

</div>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Create Account</h1>
                        <p>Join RaushanSYNC Maths to start learning</p>
                    </div>

                    <div class="error" id="errorMessage" role="alert" aria-live="polite"></div>
                    <div class="success" id="successMessage" role="status" aria-live="polite"></div>
                    <div class="loading" id="loading">Please wait...</div>
                    <button type="button" id="googleSignupBtn" class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background-color: white; color: #333; border: 1px solid #ccc; font-weight: 500; margin-bottom: 2rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>     
                        </svg>
                        Continue with Google
                    </button>

                    <div class="divider">
                        <span>OR SIGN UP WITH EMAIL</span>
                    </div>
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" placeholder="Your Name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="your@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                    <svg class="eye-off-icon" style="display: none; width: 20px; height: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />

                                    <svg class="eye-icon-confirm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">

                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>

                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />

                                    <option value="class 07">Class 07</option>

    <!-- Load dependencies first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <script src="/assets/js/auth-config.js"></script>
    
    <!-- Main app script -->
    <script src="/assets/js/script.js"></script>
    
    <!-- Auth guard for protected pages -->
    <script src="/assets/js/auth-guard.js"></script>

    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const educationLevel = document.getElementById("educationLevel").value;
            const phoneNumber = document.getElementById("phoneNumber").value.trim();
            const errorDiv = document.getElementById("errorMessage");
            const loadingDiv = document.getElementById("loading");
            const signupBtn = document.getElementById("signupBtn");

            if (!fullName || !email || !password || !confirmPassword || !educationLevel) {
                errorDiv.textContent = "Please fill in all required fields.";
                errorDiv.classList.add("show");
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = "Password must be at least 8 characters long.";
                errorDiv.classList.add("show");
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.classList.add("show");
                return;
            }

            if (!window.supabaseClient) {
                errorDiv.textContent = "Authentication service unavailable.";
                errorDiv.classList.add("show");
                return;
            }

            signupBtn.disabled = true;
            loadingDiv.classList.add("show");
            errorDiv.classList.remove("show");

            try {
                const redirectParam = new URLSearchParams(window.location.search).get("redirect");
                const safeDest = redirectParam && typeof window.getSafeRedirectPath === 'function'
                    ? window.getSafeRedirectPath(redirectParam, "/dashboard")
                    : "/dashboard";
                    
                const { data, error } = await window.supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: window.location.origin + safeDest,
                        data: {
                            full_name: fullName,
                            education_level: educationLevel,
                            phone: phoneNumber
                        }
                    }
                });

                if (error) {
                    // Display detailed error information
                    let errorMessage = error.message || "Signup failed. Please try again.";
                    
                    // Clean up ugly password error from Supabase
                    if (errorMessage.includes("contain at least one character of each") || errorMessage.includes("abcdefghijklmnopqrstuvwxyz")) {
                        errorMessage = "Password must contain at least one letter and one number.";
                    } else if (error.status) {
                        // Add error code/status for debugging for other errors
                        errorMessage += ` (Code: ${error.status})`;
                    }
                    
                    errorDiv.textContent = errorMessage;
                    errorDiv.classList.add("show");
                    
                    // Log for debugging (only on localhost/dev)
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        console.error("Signup error details:", {
                            message: error.message,
                            status: error.status,
                            code: error.code,
                            fullError: error
                        });
                    }
                    
                    signupBtn.disabled = false;
                    loadingDiv.classList.remove("show");
                    return;
                }

                if (data.user) {
                    // Sync user profile to database before redirecting
                    try {
                        await window.syncUserProfile();
                    } catch (syncErr) {
                        // Profile sync error - continue anyway as user is created
                        window.logEvent('Profile sync failed during signup', { error: syncErr });
                    }
                    window.location.replace("/login?message=check-email");
                }
            } catch (err) {
                errorDiv.textContent = "An error occurred. Please try again.";
                errorDiv.classList.add("show");
                signupBtn.disabled = false;
                loadingDiv.classList.remove("show");
            }
        }

        // Password visibility toggles
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");
        const eyeIcon = document.querySelector(".eye-icon");
        const eyeOffIcon = document.querySelector(".eye-off-icon");

        passwordToggle.addEventListener("click", (e) => {
            e.preventDefault();
            const isPasswordVisible = passwordInput.type === "text";
            passwordInput.type = isPasswordVisible ? "password" : "text";
            eyeIcon.style.display = isPasswordVisible ? "block" : "none";
            eyeOffIcon.style.display = isPasswordVisible ? "none" : "block";
        });

        const confirmPasswordInput = document.getElementById("confirmPassword");
        const confirmPasswordToggle = document.getElementById("confirmPasswordToggle");
        const eyeIconConfirm = document.querySelector(".eye-icon-confirm");
        const eyeOffIconConfirm = document.querySelector(".eye-off-icon-confirm");

        confirmPasswordToggle.addEventListener("click", (e) => {
            e.preventDefault();
            const isPasswordVisible = confirmPasswordInput.type === "text";
            confirmPasswordInput.type = isPasswordVisible ? "password" : "text";
            eyeIconConfirm.style.display = isPasswordVisible ? "block" : "none";
            eyeOffIconConfirm.style.display = isPasswordVisible ? "none" : "block";
        });

        document.getElementById("signupForm").addEventListener("submit", handleSignup);

        // Handle Google Signup/Login
        document.getElementById('googleSignupBtn').addEventListener('click', async () => {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.classList.remove("show");

            try {
                const { data, error } = await window.supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/dashboard',
                        queryParams: {
                            prompt: 'select_account'
                        }
                    }
                });

                if (error) {
                    errorDiv.textContent = error.message || "Google signup failed. Please try again.";
                    errorDiv.classList.add("show");
                }
            } catch (err) {
                console.error("Google Auth Error:", err.message);
                errorDiv.textContent = "An error occurred during Google signup. Please try again.";
                errorDiv.classList.add("show");
            }
        });
    </script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('Service Worker registered successfully'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
